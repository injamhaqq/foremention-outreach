name: foremention-outreach

services:
  outreach:
    # Always build this repository. Pulling the upstream Linki image would silently
    # remove Foremention Customer Hunter, its safety gates, and the autonomous GTM code.
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:${PORT:-3456}:3000"
    volumes:
      # SQLite is the operational state store today. Keep it outside the container.
      - ./data:/data
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      LINKI_DB_PATH: /data/linki.db
      # Background runners / autopilot / schedulers are OFF by default. To start
      # them, export HUNTER_RUNNERS_ENABLED=true in the shell (or in a compose
      # `.env` file) before `docker compose up`. This key overrides .env.local.
      HUNTER_RUNNERS_ENABLED: ${HUNTER_RUNNERS_ENABLED:-false}
      # Outbound email is LOCKED by default (every send path: sequencer, inbox
      # reply, manual compose, send-test). Compliance config alone does not
      # unlock it. Overrides .env.local; export OUTREACH_EMAIL_SENDING_ENABLED=true
      # only after founder review.
      OUTREACH_EMAIL_SENDING_ENABLED: ${OUTREACH_EMAIL_SENDING_ENABLED:-false}
    restart: unless-stopped
    init: true
    # Chromium-backed LinkedIn sessions are more stable with adequate shared memory.
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: "1.5"

  sqlite-backup:
    # Optional off-host disaster recovery. Enable only after configuring the
    # LITESTREAM_* variables and keep exactly one active replicator.
    profiles: ["backup"]
    image: litestream/litestream:0.5.17
    command: ["replicate", "-config", "/etc/litestream.yml"]
    env_file:
      - .env.local
    volumes:
      - ./data:/data
      - ./ops/litestream-r2.yml.example:/etc/litestream.yml:ro
    depends_on:
      outreach:
        condition: service_healthy
    restart: unless-stopped

