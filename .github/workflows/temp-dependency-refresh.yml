name: Temporary Dependency Refresh

on:
  push:
    branches:
      - feature/gtm-autopilot-360
    paths:
      - .github/workflows/temp-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gtm-autopilot-360
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh security-sensitive production dependencies
        run: |
          npm install --package-lock-only --save-exact \
            next@16.3.5 \
            next-auth@4.24.15 \
            nodemailer@10.0.10 \
            mailparser@3.9.28
          npm audit fix --package-lock-only --omit=dev || true

      - name: Commit refreshed manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: refresh vulnerable production dependencies"
          git push origin HEAD:feature/gtm-autopilot-360
