name: Customer Hunter CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/foremention-customer-hunter

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Customer Hunter tests
        run: npm run test:hunter

      - name: Lint Customer Hunter code
        run: npx eslint lib/hunter tests/hunter

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Customer Hunter browser acceptance
        run: npm run test:e2e:hunter
