name: Attach Railway persistence volume

on:
  push:
    branches:
      - ops/attach-railway-volume
    paths:
      - ".github/workflows/attach-railway-volume.yml"

permissions:
  contents: read

jobs:
  attach-volume:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: a32680ce-a8ef-4853-b764-bb61ea3859c8
      ENVIRONMENT_ID: aa6952b4-b0f4-468f-9ce6-099e061dce14
      SERVICE_ID: 7d209031-640c-4167-853a-2103bd6516b2
      RAILWAY_TOKEN_PRIMARY: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_TOKEN_FALLBACK: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Railway token
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_TOKEN_PRIMARY}" ]; then
            echo "RAILWAY_TOKEN=${RAILWAY_TOKEN_PRIMARY}" >> "$GITHUB_ENV"
            echo "Using repository secret RAILWAY_TOKEN"
          elif [ -n "${RAILWAY_TOKEN_FALLBACK}" ]; then
            echo "RAILWAY_TOKEN=${RAILWAY_TOKEN_FALLBACK}" >> "$GITHUB_ENV"
            echo "Using repository secret RAILWAY_API_TOKEN"
          else
            echo "::error::No RAILWAY_TOKEN or RAILWAY_API_TOKEN repository secret is configured."
            exit 42
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Ensure /data volume is attached
        shell: bash
        run: |
          set -euo pipefail
          railway volume list             --project "$PROJECT_ID"             --service "$SERVICE_ID"             --environment "$ENVIRONMENT_ID"             --json | tee /tmp/railway-volumes-before.json

          if grep -Eq '"/data"' /tmp/railway-volumes-before.json; then
            echo "A volume mounted at /data already exists; no change needed."
          else
            railway volume add               --mount-path /data               --project "$PROJECT_ID"               --service "$SERVICE_ID"               --environment "$ENVIRONMENT_ID"               --json
          fi

          railway volume list             --project "$PROJECT_ID"             --service "$SERVICE_ID"             --environment "$ENVIRONMENT_ID"             --json | tee /tmp/railway-volumes-after.json

          grep -Eq '"/data"' /tmp/railway-volumes-after.json
          echo "Verified: persistent volume is attached at /data."
