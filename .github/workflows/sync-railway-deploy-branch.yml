name: Sync Railway deploy branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: railway-deploy-branch-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to Railway deployment branch
        run: git push --force origin HEAD:feature/gtm-autopilot-360
